services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/projectmanager
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    ports:
      - '6432:5432'
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # Docker-specific overrides (different hostnames from .env)
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/projectmanager?pgbouncer=true
      DIRECT_URL: postgresql://postgres:postgres@db:5432/projectmanager
      REDIS_URL: redis://redis:6379
      # Local default; override to https://task.kovarsta.com in production
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Trust the X-Forwarded-For added by Caddy (via the rathole tunnel) so the
      # rate limiter keys on the real client IP. Leave empty when accessed directly.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-0}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # rathole client: exposes the local app (port 3000) through the public
  # Lightsail server. Dial-out only — no inbound ports needed on this box.
  tunnel:
    image: rapiz1/rathole:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/rathole-client.toml:/app/config.toml:ro
    command: ["config.toml"]

  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8080:80'

volumes:
  postgres-data:
