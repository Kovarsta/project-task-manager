apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cookieCutter
  template:
    metadata:
      labels:
        app: cookieCutter
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
